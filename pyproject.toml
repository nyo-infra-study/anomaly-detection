[project]
name = "anomaly-detection"
version = "0.1.0"
description = "TimesNet-based anomaly detection service"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pydantic-settings>=2.0",
    "structlog>=24.0",
    "httpx>=0.27",
    "prometheus-client>=0.20",
    "aiohttp>=3.9",
    "numpy>=1.26,<3",
    "onnxruntime>=1.18",
    "pandas>=3.0.3",
    "scikit-learn>=1.9.0",
    "patool>=4.0.5",
    "tqdm>=4.68.2",
    "einops>=0.8.2",
    "huggingface-hub>=1.18.0",
    "reformer-pytorch>=1.4.4",
    "local-attention>=1.11.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
]
train = [
    "torch>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anomaly_detection"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/anomaly_detection"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "raise RuntimeError\\(\"Unexpected",
]
exclude_also = [
    # TYPE_CHECKING imports are never executed at runtime
    "^\\s*from .* import .* if TYPE_CHECKING",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
warn_return_any = false
